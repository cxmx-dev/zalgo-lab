<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zalgo Lab • Slight Glitch</title>
<style>
  body { font-family: system-ui; background:#111; color:#ddd; padding:40px; }
  textarea { width:100%; height:120px; font-size:1.2em; background:#1a1a1a; color:#eee; border:1px solid #333; padding:12px; }
  #preview { font-size:2em; line-height:1.4; min-height:120px; padding:20px; background:#1a1a1a; border:1px solid #333; margin:20px 0; }
  input[type=range] { width:100%; }
</style>
</head>
<body>
  <h1>Zalgo Lab <span style="font-size:0.6em;opacity:0.6;">slight edition</span></h1>
  
  <textarea id="input" placeholder="type words here"></textarea>
  
  <label>Intensity: <span id="intensityVal">3</span></label>
  <input type="range" id="intensity" min="1" max="8" value="3">
  
  <div id="preview"></div>
  
  <button onclick="copyToClipboard()">Copy Zalgo Text</button>

<script>
function zalgoText(text, intensity) {
  const combining = [];
  for (let i = 0x0300; i <= 0x036F; i++) combining.push(String.fromCharCode(i));
  
  let result = '';
  for (let char of text) {
    result += char;
    for (let i = 0; i < intensity; i++) {
      result += combining[Math.floor(Math.random() * combining.length)];
    }
  }
  return result;
}

function update() {
  const text = document.getElementById('input').value;
  const intensity = parseInt(document.getElementById('intensity').value);
  document.getElementById('intensityVal').textContent = intensity;
  document.getElementById('preview').innerHTML = zalgoText(text, intensity);
}

['input', 'intensity'].forEach(id => {
  document.getElementById(id).addEventListener('input', update);
});

function copyToClipboard() {
  navigator.clipboard.writeText(document.getElementById('preview').innerText);
}

update(); // initial run
</script>
</body>
</html>
