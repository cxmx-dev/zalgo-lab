<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zalgo Lab</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#0f0f0f; color:#ddd; padding:40px; max-width:820px; margin:auto; }
  h1 { margin:0 0 4px 0; }
  .subtitle { opacity:0.6; font-size:0.9em; }
  textarea { width:100%; height:110px; font-size:1.1em; background:#1a1a1a; color:#eee; border:1px solid #333; padding:14px; box-sizing:border-box; resize:vertical; }
  #preview { width:100%; min-height:110px; font-size:1.35em; line-height:1.35; background:#1a1a1a; border:1px solid #333; padding:16px; box-sizing:border-box; white-space:pre-wrap; word-break:break-word; }
  .controls { margin:22px 0 12px; }
  .presets, .reverse-modes { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button.preset { background:#222; color:#ddd; border:1px solid #444; padding:6px 14px; border-radius:6px; cursor:pointer; }
  button.preset:hover { background:#333; }
  button.preset.active { background:#3b1f6e; border-color:#7c3aed; color:#f3e8ff; }
  button.preset.terminal { border-color:#1a5c1a; color:#6ee76e; }
  button.preset.terminal:hover { background:#0d2b0d; }
  button.preset.terminal.active { background:#052805; border-color:#0f0; color:#0f0; box-shadow:0 0 10px rgba(0,255,80,0.25); }
  button.preset.chaos { border-color:#854d0e; color:#fbbf24; }
  button.preset.chaos:hover { background:#422006; }
  #preview.terminal-active { border-color:#1a5c1a; box-shadow:0 0 10px rgba(0,255,80,0.12); }
  #preview.raw-mode { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 1.1em; letter-spacing: 0.02em; }
  .mode-label { font-size:0.85em; opacity:0.55; margin:14px 0 6px; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
  button.action { background:#2563eb; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:0.95em; }
  button.action:hover { background:#1e40af; }
  button.action.secondary { background:#1f2937; border:1px solid #444; }
  button.action.secondary:hover { background:#374151; }
  label.action.color-picker {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1f2937;
    border: 1px solid #444;
    color: #ddd;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    margin: 0;
    font-size: 0.95em;
  }
  label.action.color-picker:hover { background: #374151; }
  label.action.color-picker input[type="color"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    border: none;
  }
  .color-swatch {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid #666;
    background: #dddddd;
    flex-shrink: 0;
  }
  .export-color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 0;
    font-size: 0.9em;
    opacity: 0.85;
  }
  .export-color-row label { display: inline; margin: 0; cursor: pointer; }
  .export-color-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  label { display:block; margin-bottom:6px; font-size:0.95em; }
  select.preset-select, input.preset-name { background:#1a1a1a; color:#eee; border:1px solid #444; padding:6px 10px; border-radius:6px; font-size:0.95em; }
  select.preset-select { min-width:140px; }
  .preset-section { margin:18px 0 14px; padding:14px 16px; background:#161616; border:1px solid rgba(91,33,182,0.35); border-radius:8px; }
  .preset-section-label { display:block; font-size:0.95em; color:#c4b5fd; margin:0 0 10px; font-weight:600; letter-spacing:0.02em; }
  .preset-name-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .preset-name-label { font-size:0.9em; opacity:0.9; min-width:48px; margin:0; color:#ddd; }
  input.preset-name { flex:1; min-width:180px; padding:10px 12px; font-size:1em; border-color:#5b21b6; box-shadow:0 0 0 1px rgba(91,33,182,0.2); }
  input.preset-name:focus { outline:none; border-color:#7c3aed; box-shadow:0 0 0 2px rgba(124,58,237,0.35); }
  .preset-actions { display:flex; flex-wrap:wrap; gap:8px; }
  button.preset.danger { border-color:#7f1d1d; color:#fca5a5; }
  button.preset.danger:hover { background:#450a0a; }
  .hints { font-size:0.8em; opacity:0.45; margin-top:18px; line-height:1.5; }
  @media (max-width: 600px) {
    body { padding:16px; }
    .presets, .reverse-modes, .actions, .preset-actions { flex-direction:column; align-items:stretch; }
    .preset-name-row { flex-direction:column; align-items:stretch; }
    button.preset, button.action, label.action.color-picker, select.preset-select, input.preset-name { width:100%; box-sizing:border-box; }
    label.action.color-picker { justify-content:center; }
  }
</style>
</head>
<body>
  <h1>Zalgo Lab <span class="subtitle">phase 3</span></h1>
  <p style="margin:6px 0 20px; opacity:0.7;">Add subtle glitch / corrupted text effects. Great for visuals, memes, and creative direction demos.</p>

  <label>Input Text</label>
  <textarea id="input" placeholder="type words here"></textarea>

  <div class="controls">
    <label>Intensity: <span id="val">3</span></label>
    <input type="range" id="intensity" min="1" max="8" value="3" style="width:100%;">

    <div class="presets">
      <button class="preset" onclick="setIntensity(2)">Slight</button>
      <button class="preset" onclick="setIntensity(4)">Medium</button>
      <button class="preset" onclick="setIntensity(7)">Heavy</button>
      <button class="preset" id="btn-reroll" onclick="reroll()">Re-roll</button>
      <button class="preset terminal" id="btn-terminal" onclick="toggleTerminal()">Corrupted Terminal</button>
      <button class="preset chaos" id="btn-slight-chaos" onclick="slightChaos()">Slight Chaos</button>
      <button class="preset chaos" id="btn-quick-chaos" onclick="quickChaos()">Quick Chaos</button>
    </div>

    <div class="mode-label">Reverse modes</div>
    <div class="reverse-modes">
      <button class="preset" id="btn-char-back" onclick="toggleMode('charBack')">CHAR-BACK</button>
      <button class="preset" id="btn-back-words" onclick="toggleMode('backWords')">BACK-WORDS</button>
    </div>

    <div class="mode-label">Layer mode <span style="opacity:0.7">(order of effects)</span></div>
    <div class="reverse-modes" id="layer-modes">
      <button class="preset active" id="layer-reverse-zalgo" onclick="setLayerMode('reverse-then-zalgo')">Reverse → Zalgo</button>
      <button class="preset" id="layer-zalgo-reverse" onclick="setLayerMode('zalgo-then-reverse')">Zalgo → Reverse</button>
      <button class="preset" id="layer-bleed" onclick="setLayerMode('bleed')" title="Extra marks on first/last N% of string">Bleed</button>
    </div>

    <label id="bleed-decay-wrap">Bleed decay: <span id="bleed-decay-val">30</span>% <span style="opacity:0.6">(edges only)</span></label>
    <input type="range" id="bleed-decay" min="10" max="50" step="5" value="30" style="width:100%;">

    <div class="preset-section">
      <span class="preset-section-label">Save / load presets</span>
      <div class="preset-name-row">
        <label class="preset-name-label" for="preset-name">Name</label>
        <input class="preset-name" id="preset-name" type="text" placeholder="type words here" maxlength="48">
      </div>
      <div class="preset-actions">
        <button class="preset" id="btn-save-preset" onclick="savePreset()">Save Preset</button>
        <select class="preset-select" id="preset-select" onchange="loadSelectedPreset()">
          <option value="">Load preset…</option>
        </select>
        <button class="preset danger" id="btn-delete-preset" onclick="deleteSelectedPreset()">Delete</button>
      </div>
    </div>

    <div class="mode-label">Output</div>
    <div class="reverse-modes">
      <button class="preset active" id="btn-preview-rendered" onclick="setPreviewMode(false)">Rendered</button>
      <button class="preset" id="btn-preview-raw" onclick="setPreviewMode(true)">Raw</button>
    </div>

    <div class="mode-label">FX export <span style="opacity:0.7">(Export FX PNG only)</span></div>
    <label id="fx-aberration-wrap">Aberration: <span id="fx-aberration-val">1</span></label>
    <input type="range" id="fx-aberration" min="0" max="2" step="0.1" value="1" style="width:100%;">
    <label id="fx-pixelation-wrap">Pixelation: <span id="fx-pixelation-val">5</span>px</label>
    <input type="range" id="fx-pixelation" min="2" max="12" step="1" value="5" style="width:100%;">
    <label id="fx-barcode-wrap">Barcode bleed: <span id="fx-barcode-val">1</span></label>
    <input type="range" id="fx-barcode" min="0" max="2" step="0.1" value="1" style="width:100%;">
  </div>

  <label>Preview</label>
  <div id="preview"></div>

  <div class="actions">
    <button class="action" id="btn-copy" onclick="copyText()">Copy Zalgo Text</button>
    <button class="action secondary" id="btn-copy-md" onclick="copyMarkdown()">Copy Markdown</button>
    <button class="action secondary" id="btn-export" onclick="exportPng(false)">Export PNG</button>
    <button class="action secondary" id="btn-export-fx" onclick="exportPng(true)">Export FX PNG</button>
    <label class="action color-picker" title="Preview text color">
      <input type="color" id="preview-color" value="#dddddd">
      <span class="color-swatch" id="preview-color-swatch"></span>
      Color
    </label>
  </div>
  <div class="export-color-row">
    <input type="checkbox" id="export-custom-color">
    <label for="export-custom-color">Use preview color on Export PNG &amp; Export FX PNG</label>
  </div>

  <p class="hints">Shortcuts (when not typing): <strong>R</strong> re-roll · <strong>C</strong> quick chaos</p>

<script>
const PRESET_KEY = 'zalgo-v4-presets';
const modes = { charBack: false, backWords: false };
let terminalMode = false;
let layerMode = 'reverse-then-zalgo';
let previewRaw = false;
let lastOutput = '';

const TERMINAL_CHARS = '░▒▓█▀▄▌▐┌┐└┘├┤┬┴┼│─';
const PREVIEW_COLORS = { normal: '#dddddd', terminal: '#6ee76e' };

function getMarks() {
  const marks = [];
  for (let i = 0x0300; i <= 0x036F; i++) marks.push(String.fromCharCode(i));
  return marks;
}

const MIRROR = {
  'a': 'ɐ', 'b': 'd', 'c': 'ɔ', 'd': 'b', 'e': 'ɘ', 'f': 'ɟ',
  'g': 'ᵷ', 'h': 'ʜ', 'i': 'i', 'j': 'ꞁ', 'k': 'ʞ', 'l': 'l',
  'm': 'ɯ', 'n': 'u', 'o': 'o', 'p': 'q', 'q': 'p', 'r': 'ɹ',
  's': 's', 't': 'ʇ', 'u': 'n', 'v': 'ʌ', 'w': 'ʍ', 'x': 'x',
  'y': 'ʎ', 'z': 'z',
  'A': '∀', 'B': 'ꓭ', 'C': 'Ɔ', 'D': 'ꓷ', 'E': 'Ǝ', 'F': 'Ⅎ',
  'G': 'פ', 'H': 'H', 'I': 'I', 'J': 'ſ', 'K': 'ʞ', 'L': '|',
  'M': 'W', 'N': 'N', 'O': 'O', 'P': 'Ԁ', 'Q': 'Ό', 'R': 'ᴚ',
  'S': 'S', 'T': '⊥', 'U': '∩', 'V': 'Λ', 'W': 'M', 'X': 'X',
  'Y': '⅄', 'Z': 'Z',
  '0': '0', '1': '⇂', '2': 'ς', '3': 'Ɛ', '4': 'ㄣ', '5': '߸',
  '6': '9', '7': 'ㄥ', '8': '8', '9': '6',
  '!': '¡', '¡': '!', '?': '¿', '¿': '?',
  '(': ')', ')': '(', '[': ']', ']': '[', '{': '}', '}': '{',
  '<': '>', '>': '<', '/': '\\', '\\': '/',
  ',': '\u2018', '.': '\u02D9', ';': ':', ':': ';',
  '"': '\u201C', "'": '\u2018', '&': '\u214B', '%': '\u2030',
  '@': '\u0259', '#': '\u266F', '$': '\uFFE5', '^': '˅', '_': '\u203E',
  '+': '+', '-': '-', '=': '=', '*': '*', '~': '~', '`': '\u02CB',
};

function mirrorChar(char) {
  return MIRROR[char] || char;
}

function charBack(text) {
  return Array.from(text).reverse().map(mirrorChar).join('');
}

function backWords(text) {
  const words = text.trim().split(/\s+/);
  if (!words.length || (words.length === 1 && words[0] === '')) return text;
  return words
    .reverse()
    .map(word => Array.from(word).reverse().join(''))
    .join(' ');
}

function applyReverseModes(text) {
  if (modes.charBack) return charBack(text);
  if (modes.backWords) return backWords(text);
  return text;
}

function toggleMode(mode) {
  if (mode === 'charBack') {
    modes.charBack = !modes.charBack;
    if (modes.charBack) modes.backWords = false;
  } else {
    modes.backWords = !modes.backWords;
    if (modes.backWords) modes.charBack = false;
  }
  syncModeButtons();
  updatePreview();
}

function syncModeButtons() {
  document.getElementById('btn-char-back').classList.toggle('active', modes.charBack);
  document.getElementById('btn-back-words').classList.toggle('active', modes.backWords);
}

function makeZalgo(text, intensity) {
  const marks = getMarks();
  let out = '';
  for (const char of text) {
    out += char;
    for (let i = 0; i < intensity; i++) {
      out += marks[Math.floor(Math.random() * marks.length)];
    }
  }
  return out;
}

function createTerminalBlockState() {
  return { sinceBlock: 0, nextBlock: 4 + Math.floor(Math.random() * 5) };
}

function maybeAppendTerminalBlock(char, state, shouldSprinkle) {
  if (!shouldSprinkle || !char.trim()) return { block: '', state };
  const next = { ...state, sinceBlock: state.sinceBlock + 1 };
  if (next.sinceBlock >= next.nextBlock) {
    return {
      block: TERMINAL_CHARS[Math.floor(Math.random() * TERMINAL_CHARS.length)],
      state: { sinceBlock: 0, nextBlock: 4 + Math.floor(Math.random() * 5) },
    };
  }
  return { block: '', state: next };
}

function makeTerminalZalgo(text, intensity) {
  const marks = getMarks();
  const heavy = Math.max(intensity, 7);
  let out = '';
  let blockState = createTerminalBlockState();

  for (const char of text) {
    out += char;
    const markCount = heavy + (Math.random() < 0.4 ? 1 : 0);
    for (let i = 0; i < markCount; i++) {
      out += marks[Math.floor(Math.random() * marks.length)];
    }
    const sprinkled = maybeAppendTerminalBlock(char, blockState, true);
    out += sprinkled.block;
    blockState = sprinkled.state;
  }
  return out;
}

function toggleTerminal() {
  terminalMode = !terminalMode;
  if (terminalMode) {
    document.getElementById('intensity').value = 7;
  }
  syncTerminalButton();
  updatePreview();
  if (terminalMode) flashButton('btn-terminal', 'BREACH ACTIVE');
}

function getDefaultPreviewColor() {
  return terminalMode ? PREVIEW_COLORS.terminal : PREVIEW_COLORS.normal;
}

function setPreviewTextColor(hex) {
  document.getElementById('preview').style.color = hex;
  const input = document.getElementById('preview-color');
  const swatch = document.getElementById('preview-color-swatch');
  if (input) input.value = hex;
  if (swatch) swatch.style.background = hex;
}

function syncPreviewColorFromMode() {
  setPreviewTextColor(getDefaultPreviewColor());
}

function getExportDrawColor() {
  if (document.getElementById('export-custom-color')?.checked) {
    return document.getElementById('preview-color').value;
  }
  return getDefaultPreviewColor();
}

function syncTerminalButton() {
  document.getElementById('btn-terminal').classList.toggle('active', terminalMode);
  document.getElementById('preview').classList.toggle('terminal-active', terminalMode);
  syncPreviewColorFromMode();
}

function applyZalgo(text, intensity) {
  return terminalMode ? makeTerminalZalgo(text, intensity) : makeZalgo(text, intensity);
}

function getBleedDecay() {
  return parseInt(document.getElementById('bleed-decay').value, 10) / 100;
}

function makeBleedZalgo(text, intensity, edgeFraction) {
  const chars = Array.from(text);
  const len = chars.length;
  const frac = edgeFraction != null ? edgeFraction : getBleedDecay();
  const edgeLen = Math.max(1, Math.ceil(len * frac));
  const marks = getMarks();
  let out = '';
  let blockState = createTerminalBlockState();

  for (let i = 0; i < chars.length; i++) {
    const char = chars[i];
    const inEdge = i < edgeLen || i >= len - edgeLen;
    const markIntensity = inEdge ? Math.min(intensity + 2, 8) : intensity;

    out += char;
    let markCount = markIntensity;
    if (terminalMode && inEdge) {
      markCount = Math.max(markIntensity, 7) + (Math.random() < 0.4 ? 1 : 0);
    }
    for (let j = 0; j < markCount; j++) {
      out += marks[Math.floor(Math.random() * marks.length)];
    }
    const sprinkled = maybeAppendTerminalBlock(char, blockState, terminalMode && inEdge);
    out += sprinkled.block;
    blockState = sprinkled.state;
  }
  return out;
}

function buildOutput(rawText, intensity) {
  if (layerMode === 'zalgo-then-reverse') {
    return applyReverseModes(applyZalgo(rawText, intensity));
  }
  if (layerMode === 'bleed') {
    return makeBleedZalgo(applyReverseModes(rawText), intensity, getBleedDecay());
  }
  return applyZalgo(applyReverseModes(rawText), intensity);
}

function setLayerMode(mode) {
  layerMode = mode;
  syncLayerButtons();
  updatePreview();
}

function syncLayerButtons() {
  const map = {
    'reverse-then-zalgo': 'layer-reverse-zalgo',
    'zalgo-then-reverse': 'layer-zalgo-reverse',
    'bleed': 'layer-bleed',
  };
  for (const [mode, id] of Object.entries(map)) {
    document.getElementById(id).classList.toggle('active', layerMode === mode);
  }
}

function getExportModeTag() {
  const tags = [];
  if (terminalMode) tags.push('terminal');
  if (layerMode === 'bleed') tags.push('bleed');
  else if (layerMode === 'zalgo-then-reverse') tags.push('zrev');
  if (modes.charBack) tags.push('charback');
  else if (modes.backWords) tags.push('backwords');
  else if (!terminalMode && layerMode === 'reverse-then-zalgo') tags.push('forward');
  return tags.join('-') || 'forward';
}

function getPreviewStyles() {
  const preview = document.getElementById('preview');
  const cs = getComputedStyle(preview);
  return {
    font: cs.font,
    fontSize: parseFloat(cs.fontSize),
    lineHeight: parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.35,
    color: cs.color,
    background: cs.backgroundColor,
    padding: parseFloat(cs.paddingLeft) || 16,
  };
}

function wrapCanvasLines(ctx, text, maxWidth) {
  const lines = [];
  for (const paragraph of text.split('\n')) {
    let line = '';
    for (const char of paragraph) {
      const test = line + char;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = char;
      } else {
        line = test;
      }
    }
    lines.push(line);
  }
  return lines.length ? lines : [''];
}

function drawCanvasText(ctx, lines, pad, startY, lineHeight, offsetX, color) {
  ctx.fillStyle = color;
  lines.forEach((line, i) => {
    ctx.fillText(line, pad + offsetX, startY + i * lineHeight);
  });
}

const FX_EXPORT_SCALE = 2;
const FX_DEFAULTS = { aberrationStrength: 1, pixelationSize: 5, barcodeIntensity: 1 };

function getFxAberrationStrength() {
  const el = document.getElementById('fx-aberration');
  return el ? parseFloat(el.value) : FX_DEFAULTS.aberrationStrength;
}

function getFxPixelationSize() {
  const el = document.getElementById('fx-pixelation');
  return el ? parseInt(el.value, 10) : FX_DEFAULTS.pixelationSize;
}

function getFxBarcodeIntensity() {
  const el = document.getElementById('fx-barcode');
  return el ? parseFloat(el.value) : FX_DEFAULTS.barcodeIntensity;
}

function getFxPixelationStrength(pixelSize) {
  const size = pixelSize != null ? pixelSize : getFxPixelationSize();
  if (size <= FX_DEFAULTS.pixelationSize) return 1;
  return FX_DEFAULTS.pixelationSize / size;
}

function getFxParams() {
  const pixelationSize = getFxPixelationSize();
  return {
    aberrationStrength: getFxAberrationStrength(),
    pixelationSize,
    barcodeIntensity: getFxBarcodeIntensity(),
    pixelationStrength: getFxPixelationStrength(pixelationSize),
  };
}

function syncFxControlLabels() {
  document.getElementById('fx-aberration-val').textContent = getFxAberrationStrength();
  document.getElementById('fx-pixelation-val').textContent = getFxPixelationSize();
  document.getElementById('fx-barcode-val').textContent = getFxBarcodeIntensity();
}

function parseExportColor(color) {
  if (!color) return [221, 221, 221];
  if (color.startsWith('#')) {
    const h = color.length === 4
      ? color.slice(1).split('').map(ch => ch + ch).join('')
      : color.slice(1);
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16),
    ];
  }
  const m = color.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
  if (m) return [Math.round(+m[1]), Math.round(+m[2]), Math.round(+m[3])];
  return [221, 221, 221];
}

function applyChromaticAberration(ctx, width, height, strength) {
  const s = strength != null ? Math.max(0, strength) : 1;
  if (s <= 0) return;
  const shiftPx = Math.max(3, Math.round(6 * s));
  const src = ctx.getImageData(0, 0, width, height);
  const out = ctx.createImageData(width, height);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const oi = (y * width + x) * 4;
      const xr = Math.min(width - 1, x + shiftPx);
      const xb = Math.max(0, x - shiftPx);
      const ri = (y * width + xr) * 4;
      const bi = (y * width + xb) * 4;
      const lum = src.data[oi] + src.data[oi + 1] + src.data[oi + 2];
      if (lum < 20) {
        out.data[oi] = 0;
        out.data[oi + 1] = 0;
        out.data[oi + 2] = 0;
        out.data[oi + 3] = 255;
        continue;
      }
      out.data[oi] = src.data[ri];
      out.data[oi + 1] = src.data[oi + 1];
      out.data[oi + 2] = src.data[bi + 2];
      out.data[oi + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
}

function applyHeavyScanlines(ctx, width, height, spacing) {
  const step = spacing || 2;
  for (let y = 0; y < height; y += step) {
    ctx.fillStyle = y % (step * 2) === 0 ? 'rgba(0, 0, 0, 0.14)' : 'rgba(0, 0, 0, 0.06)';
    ctx.fillRect(0, y, width, 1);
  }
}

function applyPixelation(ctx, width, height, pixelSize, strength) {
  const s = strength != null ? Math.max(0, Math.min(1, strength)) : 1;
  if (s <= 0 || pixelSize <= 1) return;

  const source = ctx.canvas;
  const original = s < 1 ? ctx.getImageData(0, 0, width, height) : null;
  const tmp = document.createElement('canvas');
  const smallW = Math.max(1, Math.floor(width / pixelSize));
  const smallH = Math.max(1, Math.floor(height / pixelSize));
  tmp.width = smallW;
  tmp.height = smallH;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(source, 0, 0, width, height, 0, 0, smallW, smallH);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(tmp, 0, 0, smallW, smallH, 0, 0, width, height);
  ctx.imageSmoothingEnabled = true;

  if (s < 1 && original) {
    const pixelated = ctx.getImageData(0, 0, width, height);
    const blend = ctx.createImageData(width, height);
    const inv = 1 - s;
    for (let i = 0; i < blend.data.length; i += 4) {
      blend.data[i] = original.data[i] * inv + pixelated.data[i] * s;
      blend.data[i + 1] = original.data[i + 1] * inv + pixelated.data[i + 1] * s;
      blend.data[i + 2] = original.data[i + 2] * inv + pixelated.data[i + 2] * s;
      blend.data[i + 3] = 255;
    }
    ctx.putImageData(blend, 0, 0);
  }
}

function drawBarcodeStrip(ctx, startX, endX, height, intensity) {
  const t = intensity != null ? intensity : 1;
  if (t <= 0) return;
  const step = Math.max(1, Math.round(3 - t));
  for (let x = startX; x < endX; x++) {
    for (let y = 0; y < height; y += step + Math.floor(Math.random() * (4 / t))) {
      const barH = Math.max(1, Math.round((2 + Math.floor(Math.random() * 10)) * t));
      const darkAlpha = 0.55 * t;
      ctx.fillStyle = Math.random() < 0.55 ? `rgba(0, 0, 0, ${darkAlpha})` : `rgba(255, 255, 255, ${0.1 * t})`;
      ctx.fillRect(x, y, Math.max(1, Math.round((1 + Math.floor(Math.random() * 3)) * t)), barH);
    }
  }
}

function applyBarcodeBleed(ctx, width, height, intensity) {
  const t = intensity != null ? intensity : 1;
  if (t <= 0) return;
  const stripW = Math.max(10, Math.floor(width * 0.06 * t));
  drawBarcodeStrip(ctx, 0, stripW, height, t);
  drawBarcodeStrip(ctx, width - stripW, width, height, t);
  const bandCount = Math.max(1, Math.round(4 * t));
  for (let i = 0; i < bandCount; i++) {
    const bandY = Math.floor(Math.random() * height);
    const bandH = Math.max(1, Math.round((3 + Math.floor(Math.random() * 8)) * t));
    ctx.fillStyle = `rgba(255, 40, 80, ${0.18 * t})`;
    ctx.fillRect(0, bandY, width, bandH);
    ctx.fillStyle = `rgba(0, 200, 255, ${0.12 * t})`;
    ctx.fillRect(2, bandY + 1, width - 4, Math.max(1, bandH - 2));
  }
}

function applyFxPostProcess(ctx, pixelSize, barcodeIntensity, pixelStrength, aberrationStrength) {
  const canvas = ctx.canvas;
  const pw = canvas.width;
  const ph = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  applyHeavyScanlines(ctx, pw, ph, 2);
  applyBarcodeBleed(ctx, pw, ph, barcodeIntensity != null ? barcodeIntensity : FX_DEFAULTS.barcodeIntensity);
  applyPixelation(ctx, pw, ph, pixelSize, pixelStrength != null ? pixelStrength : 1);
  applyChromaticAberration(ctx, pw, ph, aberrationStrength != null ? aberrationStrength : FX_DEFAULTS.aberrationStrength);
}

function applyFxGlitch(ctx, lines, pad, startY, lineHeight, baseColor, strength) {
  const s = strength != null ? strength : FX_DEFAULTS.aberrationStrength;
  if (s > 0) {
    ctx.globalAlpha = 0.14 * Math.min(s, 2);
    drawCanvasText(ctx, lines, pad, startY + Math.round(s), lineHeight, Math.round(s * 0.6), baseColor);
    ctx.globalAlpha = 1;
  }
  drawCanvasText(ctx, lines, pad, startY, lineHeight, 0, baseColor);
}

function normalizeExportText(text, fx) {
  const normalized = text.replace(/\r\n/g, '\n');
  if (!fx) return normalized;
  return normalized;
}

function getFxExportLines(text) {
  const rows = text.split('\n').map(row => row.replace(/[\n\r]/g, ''));
  return rows.length ? rows : [''];
}

function getExportText(fx) {
  if (fx) return normalizeExportText(lastOutput || buildOutput(document.getElementById('input').value, parseInt(document.getElementById('intensity').value, 10)), true);
  return normalizeExportText(lastOutput || document.getElementById('preview').innerText, false);
}

function setupExportCanvas(text, styles, fx) {
  const pad = styles.padding;
  const zalgoPad = Math.ceil(styles.fontSize * 0.9);
  const previewWidth = document.getElementById('preview').clientWidth;
  const maxWidth = previewWidth - pad * 2;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = styles.font;
  const lineHeight = styles.lineHeight;
  let lines;
  let width;
  let height;
  if (fx) {
    lines = getFxExportLines(text);
    let maxTextWidth = 0;
    for (const line of lines) {
      maxTextWidth = Math.max(maxTextWidth, ctx.measureText(line).width);
    }
    width = Math.max(previewWidth, Math.ceil(maxTextWidth) + pad * 2);
    height = Math.ceil(lines.length * lineHeight + pad * 2 + zalgoPad * 2);
  } else {
    lines = wrapCanvasLines(ctx, text, maxWidth);
    const textBlockHeight = lines.length * lineHeight;
    width = Math.max(previewWidth, 320);
    height = Math.ceil(textBlockHeight + pad * 2 + zalgoPad * 2);
  }
  canvas.width = width * FX_EXPORT_SCALE;
  canvas.height = height * FX_EXPORT_SCALE;
  ctx.scale(FX_EXPORT_SCALE, FX_EXPORT_SCALE);
  return {
    canvas,
    ctx,
    lines,
    pad,
    width,
    height,
    lineHeight,
    startY: pad + zalgoPad + styles.fontSize * 0.85,
  };
}

function fillExportBackground(ctx, width, height, background) {
  ctx.fillStyle = background;
  ctx.fillRect(0, 0, width, height);
  ctx.textBaseline = 'alphabetic';
}

function downloadCanvasPng(canvas, filename, buttonId, flashMsg) {
  canvas.toBlob(blob => {
    if (!blob) {
      alert('Export failed — canvas could not render.');
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.click();
    URL.revokeObjectURL(url);
    flashButton(buttonId, flashMsg);
  }, 'image/png');
}

function exportPng(fx) {
  const text = getExportText(fx);
  if (!text.trim()) return;

  const styles = getPreviewStyles();
  const { canvas, ctx, lines, pad, width, height, lineHeight, startY } = setupExportCanvas(text, styles, fx);
  fillExportBackground(ctx, width, height, styles.background);

  const drawColor = getExportDrawColor();
  if (fx) {
    const fxParams = getFxParams();
    applyFxGlitch(ctx, lines, pad, startY, lineHeight, drawColor, fxParams.aberrationStrength);
    applyFxPostProcess(ctx, fxParams.pixelationSize, fxParams.barcodeIntensity, fxParams.pixelationStrength, fxParams.aberrationStrength);
  } else {
    drawCanvasText(ctx, lines, pad, startY, lineHeight, 0, drawColor);
  }

  const intensity = document.getElementById('intensity').value;
  const fxTag = fx ? '-fx' : '';
  const filename = `zalgo-i${intensity}-${getExportModeTag()}${fxTag}-4-062726.png`;
  downloadCanvasPng(canvas, filename, fx ? 'btn-export-fx' : 'btn-export', fx ? 'FX Exported!' : 'Exported!');
}

function flashButton(id, msg) {
  const btn = document.getElementById(id);
  const original = btn.textContent;
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = original; }, 1400);
}

function renderPreview(output) {
  lastOutput = output;
  const preview = document.getElementById('preview');
  if (previewRaw) {
    preview.textContent = output;
    preview.classList.add('raw-mode');
  } else {
    preview.innerHTML = output;
    preview.classList.remove('raw-mode');
  }
}

function setPreviewMode(raw) {
  previewRaw = raw;
  document.getElementById('btn-preview-rendered').classList.toggle('active', !raw);
  document.getElementById('btn-preview-raw').classList.toggle('active', raw);
  renderPreview(lastOutput || buildOutput(document.getElementById('input').value, parseInt(document.getElementById('intensity').value)));
}

function presetLabel(p) {
  if (p.name && p.name.trim()) return p.name.trim();
  const slice = (p.input || '').slice(0, 24);
  return slice || 'preset';
}

function captureState() {
  return {
    name: document.getElementById('preset-name').value.trim(),
    intensity: parseInt(document.getElementById('intensity').value, 10),
    charBack: modes.charBack,
    backWords: modes.backWords,
    layerMode,
    terminalMode,
    bleedDecay: getBleedDecay(),
    previewRaw,
    input: document.getElementById('input').value,
    savedAt: Date.now(),
  };
}

function applyState(state) {
  document.getElementById('intensity').value = state.intensity;
  document.getElementById('val').textContent = state.intensity;
  modes.charBack = !!state.charBack;
  modes.backWords = !!state.backWords;
  layerMode = state.layerMode || 'reverse-then-zalgo';
  terminalMode = !!state.terminalMode;
  const decayPct = Math.round((state.bleedDecay != null ? state.bleedDecay : 0.3) * 100);
  document.getElementById('bleed-decay').value = decayPct;
  document.getElementById('bleed-decay-val').textContent = decayPct;
  previewRaw = !!state.previewRaw;
  document.getElementById('input').value = state.input || '';
  syncModeButtons();
  syncTerminalButton();
  syncLayerButtons();
  document.getElementById('btn-preview-rendered').classList.toggle('active', !previewRaw);
  document.getElementById('btn-preview-raw').classList.toggle('active', previewRaw);
  updatePreview();
}

function getPresets() {
  try {
    return JSON.parse(localStorage.getItem(PRESET_KEY) || '[]');
  } catch {
    return [];
  }
}

function refreshPresetSelect() {
  const select = document.getElementById('preset-select');
  const presets = getPresets();
  select.innerHTML = '<option value="">Load preset…</option>';
  presets.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = `${presetLabel(p)} (i${p.intensity})`;
    select.appendChild(opt);
  });
}

function savePreset() {
  const presets = getPresets();
  presets.unshift(captureState());
  if (presets.length > 10) presets.length = 10;
  localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
  refreshPresetSelect();
  flashButton('btn-save-preset', 'Saved!');
}

function loadSelectedPreset() {
  const select = document.getElementById('preset-select');
  if (select.value === '') return;
  const presets = getPresets();
  const state = presets[parseInt(select.value, 10)];
  if (state) {
    applyState(state);
    document.getElementById('preset-name').value = state.name || '';
  }
}

function deleteSelectedPreset() {
  const select = document.getElementById('preset-select');
  if (select.value === '') return;
  const idx = parseInt(select.value, 10);
  const presets = getPresets();
  if (idx < 0 || idx >= presets.length) return;
  presets.splice(idx, 1);
  localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
  select.value = '';
  refreshPresetSelect();
  flashButton('btn-delete-preset', 'Deleted!');
}

function updatePreview() {
  const rawText = document.getElementById('input').value;
  const intensity = parseInt(document.getElementById('intensity').value);
  document.getElementById('val').textContent = intensity;
  document.getElementById('bleed-decay-val').textContent = document.getElementById('bleed-decay').value;
  syncFxControlLabels();
  renderPreview(buildOutput(rawText, intensity));
}

function setIntensity(level) {
  document.getElementById('intensity').value = level;
  updatePreview();
}

function reroll() {
  updatePreview();
  flashButton('btn-reroll', 'Rolled!');
}

function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

function slightChaos() {
  const level = randInt(2, 5);
  document.getElementById('intensity').value = level;
  document.getElementById('val').textContent = level;
  updatePreview();
  flashButton('btn-slight-chaos', 'Chaos!');
}

function quickChaos() {
  const level = randInt(2, 8);
  document.getElementById('intensity').value = level;
  document.getElementById('val').textContent = level;

  if (Math.random() < 0.5) {
    if (modes.charBack || modes.backWords) {
      modes.charBack = false;
      modes.backWords = false;
    } else {
      if (Math.random() < 0.5) {
        modes.charBack = true;
        modes.backWords = false;
      } else {
        modes.backWords = true;
        modes.charBack = false;
      }
    }
    syncModeButtons();
  }

  updatePreview();
  flashButton('btn-quick-chaos', 'CHAOS!');
}

document.addEventListener('keydown', e => {
  if (document.activeElement === document.getElementById('input')) return;
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    reroll();
  } else if (e.key === 'c' || e.key === 'C') {
    e.preventDefault();
    quickChaos();
  }
});

function copyText() {
  const text = document.getElementById('preview').innerText;
  navigator.clipboard.writeText(text).then(() => flashButton('btn-copy', 'Copied!'));
}

function copyMarkdown() {
  const text = document.getElementById('preview').innerText;
  const md = '```\n' + text + '\n```';
  navigator.clipboard.writeText(md).then(() => flashButton('btn-copy-md', 'Copied MD!'));
}

['input', 'intensity', 'bleed-decay', 'fx-aberration', 'fx-pixelation', 'fx-barcode'].forEach(id => {
  document.getElementById(id).addEventListener('input', updatePreview);
});

document.getElementById('preview-color').addEventListener('input', (e) => {
  setPreviewTextColor(e.target.value);
});

refreshPresetSelect();
syncPreviewColorFromMode();
updatePreview();
</script>
</body>
